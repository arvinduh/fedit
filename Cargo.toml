[workspace]
resolver = "2"
members = [
  "crates/fedit-compress",
  "crates/fedit-awakening",
  "crates/fedit-core",
  "crates/fedit-cli",
  "crates/fedit-gui",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
fedit-compress = { path = "crates/fedit-compress" }
awakening = { path = "crates/fedit-awakening", package = "fedit-awakening" }
fedit-awakening = { path = "crates/fedit-awakening" }
fedit-core = { path = "crates/fedit-core" }
thiserror = "2"
crc32fast = "1.4"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12" }
tauri-build = { version = "2.7" }
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
wildcard_imports = "deny"
single_component_path_imports = "allow"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "warn"
unwrap_used = "warn"
missing_assert_message = "warn"
exit = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "warn"
