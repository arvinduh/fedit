[package]
name = "fedit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fedit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fe-compress = { path = "../fe-compress" }
fe13 = { path = "../fe13" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints]
workspace = true
